apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: casbinpolicies.casbin.org
spec:
  group: casbin.org
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                policyRules:
                  type: array
                  items:
                    type: object
                    required:
                      - ptype
                      - rule
                    properties:
                      ptype:
                        type: string
                        description: Policy type (e.g., "p", "p2")
                      rule:
                        type: array
                        description: Policy rule elements
                        items:
                          type: string
                groupingRules:
                  type: array
                  items:
                    type: object
                    required:
                      - ptype
                      - rule
                    properties:
                      ptype:
                        type: string
                        description: Grouping policy type (e.g., "g", "g2")
                      rule:
                        type: array
                        description: Grouping rule elements
                        items:
                          type: string
  scope: Namespaced
  names:
    plural: casbinpolicies
    singular: casbinpolicy
    kind: CasbinPolicy
    shortNames:
      - cbp
