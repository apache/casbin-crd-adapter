apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: casbinpolicies.casbin.org
spec:
  group: casbin.org
  names:
    kind: CasbinPolicy
    listKind: CasbinPolicyList
    plural: casbinpolicies
    singular: casbinpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                policyType:
                  type: string
                  description: "Type of policy: 'p' for permission policies, 'g' for grouping/role policies"
                  enum:
                    - p
                    - g
                  default: p
                rules:
                  type: array
                  description: "Array of policy rules"
                  items:
                    type: object
                    properties:
                      values:
                        type: array
                        description: "Policy rule values (e.g., subject, object, action)"
                        items:
                          type: string
                    required:
                      - values
              required:
                - rules
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.policyType
        - name: Rules
          type: integer
          jsonPath: .spec.rules.length
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
